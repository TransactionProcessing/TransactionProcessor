name: Codex reviewed PR approval

# Keep triggers in the consuming repository; centralise the review logic.
on:
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read

concurrency:
  group: codex-approval
  cancel-in-progress: false

jobs:
  approve:
    if: ${{ vars.CODEX_AUTO_APPROVAL_ENABLED == 'true' && (github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]')) }}
    uses: TransactionProcessing/org-ci-workflows/.github/workflows/reusable-codex-reviewed-approval.yml@main
    with:
      base_branch: main
      required_checks_json: >-
        [["Build and Test Pull Requests","github-actions"],
         ["Codacy Static Code Analysis","codacy-production"],
         ["CodeQL","github-advanced-security"],
         ["Analyze (csharp)","github-actions"],
         ["Analyze (actions)","github-actions"],
         ["Analyze (javascript-typescript)","github-actions"]]
    secrets:
      reviewer_token: ${{ secrets.PR_REVIEW_USER_TOKEN }}
